<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的记账本</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.2.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-color: #4e73df;
        }
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--primary-color);
            color: white;
            padding: 20px;
            position: fixed;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="mb-4"><i class="bi bi-wallet2"></i> 记账本</h4>
        <button class="btn btn-light w-100 mb-3" onclick="addRecord()">
            <i class="bi bi-plus-circle"></i> 新增记录
        </button>
        <button class="btn btn-danger w-100" onclick="logout()">
            <i class="bi bi-box-arrow-left"></i> 退出登录
        </button>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">账单记录</h5>
                <table class="table" id="records-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>类型</th>
                            <th>金额</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="records-body">
                        <!-- 记录动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 初始化Supabase（必须与index.html相同）
        const supabase = window.supabase.createClient(
            'https://your-project.supabase.co',
            'your-anon-key'
        );

        // 检查登录状态
        async function checkLogin() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (!user) window.location.href = 'index.html';
        }

        // 加载账单数据
        async function loadRecords() {
            await checkLogin();
            
            const { data, error } = await supabase
                .from('transactions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('加载失败:', error);
                return;
            }

            const tbody = document.getElementById('records-body');
            tbody.innerHTML = data.map(record => `
                <tr>
                    <td>${new Date(record.created_at).toLocaleDateString()}</td>
                    <td>${record.type === 'income' ? '收入' : '支出'}</td>
                    <td>¥${record.amount}</td>
                    <td>${record.note || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteRecord('${record.id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 删除记录
        async function deleteRecord(id) {
            if (!confirm('确定删除这条记录？')) return;
            
            const { error } = await supabase
                .from('transactions')
                .delete()
                .eq('id', id);

            if (error) {
                alert('删除失败: ' + error.message);
            } else {
                loadRecords();
            }
        }

        // 退出登录
        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', loadRecords);
    </script>
</body>
</html>
