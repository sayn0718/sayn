<!DOCTYPE html>
<html>
<head>
  <title>我的记账本</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.2.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
</head>
<body>
  <!-- 侧边导航 -->
  <div class="sidebar">
    <div class="logo">
      <i class="bi bi-wallet2"></i>
      <h4>记账本</h4>
    </div>
    <ul class="nav-links">
      <li><a href="#" id="add-record-btn"><i class="bi bi-plus-circle"></i> 记账</a></li>
      <li><a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> 退出</a></li>
    </ul>
  </div>

  <!-- 主内容区 -->
  <div class="main-content">
    <!-- 记账表单 -->
    <div class="card record-form" id="record-form">
      <div class="card-body">
        <h5>新增记录</h5>
        <div class="mb-3">
          <label>类型</label>
          <select id="type" class="form-select">
            <option value="income">收入</option>
            <option value="expense">支出</option>
          </select>
        </div>
        <div class="mb-3">
          <label>金额</label>
          <input type="number" id="amount" class="form-control">
        </div>
        <div class="mb-3">
          <label>日期</label>
          <input type="text" id="date" class="form-control date-picker">
        </div>
        <button class="btn btn-primary" onclick="saveRecord()">保存</button>
      </div>
    </div>

    <!-- 账单列表 -->
    <div class="card">
      <div class="card-body">
        <h5>历史记录</h5>
        <table class="table">
          <thead>
            <tr>
              <th>日期</th>
              <th>类型</th>
              <th>金额</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="transactions-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 初始化Supabase（必须和index.html相同）
    const supabase = window.supabase.createClient(
      'https://您的项目.supabase.co',
      '您的anon公钥'
    );

    // 检查登录状态
    async function checkAuth() {
      const { data: { user }, error } = await supabase.auth.getUser();
      if (!user) window.location.href = "index.html";
      return user;
    }

    // 退出登录
    async function logout() {
      await supabase.auth.signOut();
      window.location.href = "index.html";
    }

    // 初始化日期选择器
    function initDatePicker() {
      flatpickr(".date-picker", {
        dateFormat: "Y-m-d",
        defaultDate: new Date()
      });
    }

    // 保存记录到Supabase
    async function saveRecord() {
      const user = await checkAuth();
      const { error } = await supabase.from('transactions').insert([{
        user_id: user.id,
        type: document.getElementById('type').value,
        amount: document.getElementById('amount').value,
        date: document.getElementById('date').value
      }]);
      
      if (!error) loadTransactions();
    }

    // 加载账单数据
    async function loadTransactions() {
      const user = await checkAuth();
      const { data, error } = await supabase
        .from('transactions')
        .select('*')
        .eq('user_id', user.id)
        .order('date', { ascending: false });

      if (!error) {
        const tbody = document.getElementById('transactions-list');
        tbody.innerHTML = data.map(item => `
          <tr>
            <td>${item.date}</td>
            <td>${item.type === 'income' ? '收入' : '支出'}</td>
            <td class="${item.type}-amount">${item.type === 'income' ? '+' : '-'}${item.amount}</td>
            <td><button class="btn btn-sm btn-danger" onclick="deleteRecord('${item.id}')">删除</button></td>
          </tr>
        `).join('');
      }
    }

    // 删除记录
    async function deleteRecord(id) {
      const { error } = await supabase.from('transactions').delete().eq('id', id);
      if (!error) loadTransactions();
    }

    // 页面初始化
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      initDatePicker();
      loadTransactions();
      
      // 原有事件绑定
      document.getElementById('add-record-btn').addEventListener('click', () => {
        document.getElementById('record-form').style.display = 'block';
      });
    });
  </script>
</body>
</html>
